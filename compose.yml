services:
  sim-isaac:
    image: mws-dimos/sim-isaac:unitree-lab-5.1
    container_name: wam-isaac-sim
    entrypoint: ["/entrypoint.sh"]
    command: ["/bin/bash", "/workspace/mws-dimos/deploy/sim/ros2/entrypoints/launch_g1.sh"]
    network_mode: host
    volumes:
      - ${SERVER_WORKSPACE}/mws-dimos/deploy/images/isaac-sim/entrypoint.sh:/entrypoint.sh:ro
      - ${SERVER_WORKSPACE}/mws-dimos:/workspace/mws-dimos:rw
      - ${SERVER_WORKSPACE}/mws-dimos/modules/gwbc:/workspace/gwbc:ro
      - ${SERVER_WORKSPACE}/mws-dimos/modules/gwbc/external_dependencies/unitree_sdk2_python:/workspace/unitree_sdk2py_src:ro
      - ${SERVER_WORKSPACE}/mws-dimos/modules/gwbc/decoupled_wbc/control/robot_model/model_data/g1:/workspace/assets:ro
      - ${SERVER_WORKSPACE}/mws-dimos/assets/robots/g1:/workspace/robot_assets:ro
      - ${SERVER_WORKSPACE}/assets:/workspace/scene_assets:rw
      - sim_bridge_shm:/run/mws
    environment:
      - ACCEPT_EULA=Y
      - OMNI_KIT_ACCEPT_EULA=YES
      - PRIVACY_CONSENT=Y
      - DISPLAY=:99
      - G1_TRAINING_ASSET_DIR=/workspace/assets
      - SCENE_FILE=${SCENE_FILE:-mws_office.usdz}
      - ROBOT_USD_FILE=${ROBOT_USD_FILE:-g1_29dof.usd}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # G1_KINEMATIC_ROBOT=1 → robot pelvis fixed at spawn, joints follow WAM
      # commands exactly, never falls. Collision active → can interact with objects.
      # G1_KINEMATIC_ROBOT=0 (default) → normal physics + support wrench.
      - G1_KINEMATIC_ROBOT=${G1_KINEMATIC_ROBOT:-1}
    runtime: nvidia
    shm_size: '8gb'
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/isaac_ready"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 120s

  wam:
    build:
      context: .
      dockerfile: docker/wam/Dockerfile
    image: wam-inference:latest
    container_name: wam-inference
    network_mode: host
    volumes:
      - ${SERVER_WORKSPACE}/wam-stack/src:/workspace/wam:rw
      - ${SERVER_WORKSPACE}/wam-stack/checkpoints:/workspace/wam/checkpoints:ro
      - ${SERVER_WORKSPACE}/wam-stack/media:/workspace/wam/media:rw
      - ${SERVER_WORKSPACE}/wam-stack/repos/unifolm:/workspace/unifolm:ro
      - ${SERVER_WORKSPACE}/mws-dimos/modules/gwbc/external_dependencies/unitree_sdk2_python:/workspace/unitree_sdk2py_src:ro
      - ${SERVER_WORKSPACE}/hf_cache:/root/.cache/huggingface:rw
      - sim_bridge_shm:/run/mws
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONPATH=/workspace/wam:/workspace/unitree_sdk2py_src:/workspace/unifolm/src
      - PYTHONUNBUFFERED=1
      - WAM_MODEL=${WAM_MODEL:-unifolm}
      - WAM_CHECKPOINT=${WAM_CHECKPOINT:-/workspace/wam/checkpoints/unifolm_wma_dual.ckpt}
      - WAM_PROMPT=${WAM_PROMPT:-pick and place green cube in white basket}
      - WAM_MEDIA_DIR=${WAM_MEDIA_DIR:-/workspace/wam/media}
      - DDS_IFACE=lo
    runtime: nvidia
    shm_size: '4gb'
    stdin_open: true
    tty: true
    command: ["python", "/workspace/wam/main.py"]
    depends_on:
      sim-isaac:
        condition: service_healthy

volumes:
  sim_bridge_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m
