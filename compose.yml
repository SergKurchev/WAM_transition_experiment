# wam-stack: WAM agent + mws-dimos infrastructure (Isaac Sim, GEAR-SONIC, ROS2 Bridge)
#
# Requires: mws-dimos cloned to /root/skurchev/workspace/mws-dimos (feat/real-transfer branch)
#
# Start:
#   docker compose up -d
#
# Visual (local machine):
#   ssh -N -L 6081:localhost:6080 -p 2221 x32-techgov-GPU-01
#   http://localhost:6081

services:

  # Isaac Sim — physics simulator + rt/lowstate publisher (pre-built image from mws-dimos)
  sim-isaac:
    image: mws-dimos/sim-isaac:unitree-lab-5.1
    container_name: wam-isaac-sim
    entrypoint: ["/entrypoint.sh"]
    command: ["/bin/bash", "/workspace/mws-dimos/deploy/sim/ros2/entrypoints/launch_g1.sh"]
    network_mode: host
    volumes:
      - /root/skurchev/workspace/mws-dimos/deploy/images/isaac-sim/entrypoint.sh:/entrypoint.sh:ro
      - /root/skurchev/workspace/mws-dimos:/workspace/mws-dimos:rw
      - /root/skurchev/workspace/mws-dimos/modules/gwbc:/workspace/gwbc:ro
      - /root/skurchev/workspace/mws-dimos/modules/gwbc/external_dependencies/unitree_sdk2_python:/workspace/unitree_sdk2py_src:ro
      - /root/skurchev/workspace/mws-dimos/modules/gwbc/decoupled_wbc/control/robot_model/model_data/g1:/workspace/assets:ro
      - /root/skurchev/workspace/mws-dimos/assets/robots/g1:/workspace/robot_assets:ro
      - sim_bridge_shm:/run/mws
    environment:
      - ACCEPT_EULA=Y
      - OMNI_KIT_ACCEPT_EULA=YES
      - PRIVACY_CONSENT=Y
      - DISPLAY=:99
      - G1_TRAINING_ASSET_DIR=/workspace/assets
      - SCENE_FILE=${SCENE_FILE:-}
      - ROBOT_USD_FILE=${ROBOT_USD_FILE:-g1_29dof.usd}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    shm_size: '8gb'
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/isaac_ready"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 120s

  # GEAR-SONIC — whole-body control policy (pre-built image from mws-dimos)
  sim-gear-sonic:
    image: mws-sim-gear-sonic-policy:latest
    container_name: wam-gear-sonic
    network_mode: host
    volumes:
      - /root/skurchev/workspace/mws-dimos/modules/gwbc/gear_sonic_deploy:/opt/gear_sonic_deploy:rw
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command:
      - /usr/local/bin/g1_deploy_onnx_ref
      - lo
      - /opt/gear_sonic_deploy/policy/release/model_decoder.onnx
      - /opt/gear_sonic_deploy/reference/example/
      - --obs-config
      - /opt/gear_sonic_deploy/policy/release/observation_config.yaml
      - --encoder-file
      - /opt/gear_sonic_deploy/policy/release/model_encoder.onnx
      - --planner-file
      - /opt/gear_sonic_deploy/planner/target_vel/V2/planner_sonic.onnx
      - --input-type
      - dds
      - --output-type
      - all
      - --disable-crc-check
    runtime: nvidia
    privileged: true
    shm_size: '2gb'
    stdin_open: true
    tty: true
    restart: on-failure
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/gear-sonic-ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 180s
    depends_on:
      sim-isaac:
        condition: service_healthy

  # ROS2 Bridge — transforms isaac rt/lowstate → 994D observations for GEAR-SONIC
  sim-ros2-bridge:
    image: mws-sim-ros2-bridge:latest
    container_name: wam-ros2-bridge
    network_mode: host
    privileged: true
    volumes:
      - sim_bridge_shm:/run/mws
      - /root/skurchev/workspace/mws-dimos/deploy/sim/ros2/config.toml:/workspace/mws-dimos/deploy/sim/ros2/config.toml:ro
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - DIMOS_SIM_CONFIG_FILE=/workspace/mws-dimos/deploy/sim/ros2/config.toml
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mws_sim_ros2_bridge_ready"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 10s
    depends_on:
      sim-isaac:
        condition: service_healthy
      sim-gear-sonic:
        condition: service_healthy

  # WAM — World Action Model inference agent (built from wam-stack)
  wam:
    build:
      context: .
      dockerfile: docker/wam/Dockerfile
    image: wam-inference:latest
    container_name: wam-inference
    network_mode: host
    volumes:
      - /root/skurchev/workspace/wam-stack/src:/workspace/wam:rw
      - /root/skurchev/workspace/wam-stack/checkpoints:/workspace/wam/checkpoints:ro
      - /root/skurchev/workspace/wam-stack/media:/workspace/wam/media:rw
      - /root/skurchev/workspace/mws-dimos/modules/gwbc/external_dependencies/unitree_sdk2_python:/workspace/unitree_sdk2py_src:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONPATH=/workspace/wam:/workspace/unitree_sdk2py_src
      - PYTHONUNBUFFERED=1
      - WAM_MODEL=${WAM_MODEL:-stub}
      - WAM_CHECKPOINT=${WAM_CHECKPOINT:-}
      - DDS_IFACE=lo
    runtime: nvidia
    shm_size: '4gb'
    stdin_open: true
    tty: true
    command: ["python", "/workspace/wam/main.py"]
    depends_on:
      sim-isaac:
        condition: service_healthy
      sim-ros2-bridge:
        condition: service_healthy

volumes:
  sim_bridge_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m
